name: Release & Delta OTA

# Production: signed Release APK + AAB + R8 mapping.txt + BSDIFF40 delta patch + update.json + SHA256SUMS.txt
# Preview fallback (when channel=auto and RELEASE_* secrets are absent): debug-signed APK + delta patch.
# Required Secrets for Production Release:
#   RELEASE_KEYSTORE_BASE64, RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD
#   GOOGLE_SERVICES_JSON_BASE64, MAPS_API_KEY
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version_name:
        description: "versionName rilis (mis. 1.9)"
        required: true
        default: "1.9"
      channel:
        description: "Channel rilis: auto (pakai production jika secrets ada), production (wajib keystore), preview"
        type: choice
        default: "auto"
        options:
          - auto
          - production
          - preview

permissions:
  contents: write

concurrency:
  group: delta-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality-gate:
    name: Pre-Release Architecture, Security & Test Gate
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew || true

      - name: Prepare Environment & Firebase Config for Gate
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          {
            echo "GEMINI_API_KEY=${GEMINI_API_KEY:-dummy_ci_key}"
            echo "MAPS_API_KEY=${MAPS_API_KEY:-dummy_ci_key}"
          } > .env
          if [ ! -f "app/google-services.json" ]; then
            if [ -n "${GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
              echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
            elif [ -f "app/google-services.json.example" ]; then
              cp app/google-services.json.example app/google-services.json
            fi
          fi

      - name: Architecture Line-Cap & Audit Blocker Check
        run: |
          set -euo pipefail
          python3 .github/scripts/check_file_length.py
          python3 .github/scripts/audit_minus.py --fail-on-blocker

      - name: Run Unit Tests & Android Lint
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug --no-daemon

  release:
    name: Build Release APK/AAB, Delta Patch & Publish
    needs: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew || true

      - name: Prepare Environment, Firebase & Signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          UPDATE_MANIFEST_URL: ${{ secrets.UPDATE_MANIFEST_URL }}
          REQ_CHANNEL: ${{ github.event.inputs.channel || 'auto' }}
        run: |
          set -euo pipefail
          {
            echo "GEMINI_API_KEY=${GEMINI_API_KEY:-dummy_ci_key}"
            echo "MAPS_API_KEY=${MAPS_API_KEY:-dummy_ci_key}"
          } > .env

          HAS_KEYSTORE=false
          if [ -n "${RELEASE_KEYSTORE_BASE64:-}" ] && [ -n "${RELEASE_STORE_PASSWORD:-}" ] && [ -n "${RELEASE_KEY_PASSWORD:-}" ]; then
            HAS_KEYSTORE=true
          fi

          if [ "$REQ_CHANNEL" = "production" ] && [ "$HAS_KEYSTORE" != "true" ]; then
            echo "::error::Channel production membutuhkan secrets RELEASE_KEYSTORE_BASE64, RELEASE_STORE_PASSWORD, dan RELEASE_KEY_PASSWORD."
            exit 1
          fi

          if [ "$REQ_CHANNEL" != "preview" ] && [ "$HAS_KEYSTORE" = "true" ]; then
            if [ -n "${GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
              echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
            elif [ "$REQ_CHANNEL" = "production" ]; then
              echo "::error::Channel production membutuhkan secret GOOGLE_SERVICES_JSON_BASE64 agar Firebase Auth/Firestore/FCM aktif."
              exit 1
            elif [ -f "app/google-services.json.example" ] && [ ! -f "app/google-services.json" ]; then
              cp app/google-services.json.example app/google-services.json
            fi
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "BUILD_VARIANT=release" >> "$GITHUB_ENV"
            echo "APK_NAME=app-release.apk" >> "$GITHUB_ENV"
            echo "APK_PATH=app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_ENV"
            echo "AAB_PATH=app/build/outputs/bundle/release/app-release.aab" >> "$GITHUB_ENV"
            echo "MAPPING_PATH=app/build/outputs/mapping/release/mapping.txt" >> "$GITHUB_ENV"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$RELEASE_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$RELEASE_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${RELEASE_KEY_ALIAS:-upload}" >> "$GITHUB_ENV"
            echo "CHANNEL=production" >> "$GITHUB_ENV"
            echo "Mode: PRODUCTION (signed release APK + AAB)"
          else
            if [ ! -f "app/google-services.json" ] && [ -f "app/google-services.json.example" ]; then
              cp app/google-services.json.example app/google-services.json
            fi
            echo "BUILD_VARIANT=debug" >> "$GITHUB_ENV"
            echo "APK_NAME=app-debug.apk" >> "$GITHUB_ENV"
            echo "APK_PATH=app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_ENV"
            echo "CHANNEL=preview" >> "$GITHUB_ENV"
            echo "Mode: PREVIEW (debug signing). Set RELEASE_* secrets untuk produksi."
          fi

      - name: Resolve Version & Previous Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION_NAME="${{ inputs.version_name }}"
          else
            VERSION_NAME="${TAG#v}"
          fi
          mkdir -p prev dist
          PREV_VC=1
          APK_NAME="${APK_NAME:-app-debug.apk}"
          if gh release download --pattern "$APK_NAME" --dir prev --clobber 2>/dev/null; then
            echo "Basis patch: $APK_NAME dari rilis sebelumnya"
          elif gh release download --pattern 'app-debug.apk' --dir prev --clobber 2>/dev/null; then
            APK_NAME="app-debug.apk"
            echo "Basis patch fallback: app-debug.apk"
          else
            rm -f prev/*.apk || true
            echo "Belum ada rilis sebelumnya — rilis pertama tanpa patch."
          fi
          gh release download --pattern 'update.json' --dir prev --clobber 2>/dev/null || true
          if [ -f prev/update.json ]; then
            PREV_VC=$(python3 -c "import json;print(json.load(open('prev/update.json'))['versionCode'])")
          fi
          VERSION_CODE=$((PREV_VC + 1))
          echo "versionName=$VERSION_NAME versionCode=$VERSION_CODE (prev=$PREV_VC)"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "PREV_VC=$PREV_VC" >> "$GITHUB_ENV"
          echo "PREV_APK_NAME=$APK_NAME" >> "$GITHUB_ENV"

      - name: Assemble Release APK & App Bundle (AAB)
        env:
          VERSION_CODE: ${{ env.VERSION_CODE }}
          VERSION_NAME: ${{ env.VERSION_NAME }}
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ env.STORE_PASSWORD }}
          KEY_ALIAS: ${{ env.KEY_ALIAS }}
          KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ "${BUILD_VARIANT}" = "release" ]; then
            ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace
          else
            ./gradlew :app:assembleDebug --no-daemon --stacktrace
          fi

      - name: Install bsdiff4
        run: python3 -m pip install --quiet --break-system-packages bsdiff4

      - name: Generate Delta Patch, update.json & Checksums
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cp "$APK_PATH" "dist/$APK_NAME"
          if [ "${BUILD_VARIANT}" = "release" ]; then
            [ -f "${AAB_PATH:-}" ] && cp "$AAB_PATH" "dist/app-release.aab"
            [ -f "${MAPPING_PATH:-}" ] && cp "$MAPPING_PATH" "dist/mapping-v${VERSION_NAME}.txt"
          fi
          BASE_URL="https://github.com/${GH_REPO}/releases/download/${{ github.ref_name }}"
          ARGS=(--new-apk "dist/$APK_NAME"
                --apk-name "$APK_NAME"
                --version-code "$VERSION_CODE" --version-name "$VERSION_NAME"
                --base-url "$BASE_URL" --out-dir dist)
          PREV_APK="prev/${PREV_APK_NAME}"
          if [ -f "$PREV_APK" ]; then
            ARGS+=(--old-apk "$PREV_APK" --old-version-code "$PREV_VC")
          fi
          python3 .github/scripts/gen_delta_update.py "${ARGS[@]}" \
            --changelog "Rilis $VERSION_NAME (versionCode $VERSION_CODE, $CHANNEL)"
          (cd dist && sha256sum * > SHA256SUMS.txt)

      - name: Publish Release Assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES="DRG Driver $VERSION_NAME (versionCode $VERSION_CODE, channel: $CHANNEL). Aset mencakup APK terverifikasi SHA-256, delta patch BSDIFF40 + update.json untuk pembaruan OTA dari halaman Pengaturan$([ "${BUILD_VARIANT}" = "release" ] && echo ', serta AAB Play Store & R8 mapping.txt')."
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" dist/* --clobber
            gh release edit "${{ github.ref_name }}" --notes "$NOTES" || true
          else
            gh release create "${{ github.ref_name }}" dist/* \
              --title "DRG Driver $VERSION_NAME" --notes "$NOTES"
          fi

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-ota-${{ github.ref_name }}
          path: dist/
          retention-days: 30
