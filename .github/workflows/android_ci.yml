name: DRG Driver Android CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build, Lint & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew || true

      - name: Prepare Local Environment Secrets & Keystore
        run: |
          touch .env
          echo "GEMINI_API_KEY=dummy_ci_key" >> .env
          echo "MAPS_API_KEY=dummy_ci_key" >> .env
          if [ ! -f "debug.keystore" ]; then
            if [ -f "debug.keystore.base64" ]; then
              base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || base64 --decode debug.keystore.base64 > debug.keystore 2>/dev/null || true
            fi
            if [ ! -f "debug.keystore" ]; then
              keytool -genkeypair -keystore debug.keystore -storepass android -keypass android -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000 || true
            fi
          fi

      - name: Enforce Architecture Rules (Max 125 Lines & Modular Isolation)
        run: python3 .github/scripts/check_file_length.py

      - name: Kotlin Static Analysis (ktlint, warn-only)
        continue-on-error: true
        run: |
          set -e
          curl -sSLO https://github.com/pinterest/ktlint/releases/download/1.5.0/ktlint
          chmod a+x ktlint
          ./ktlint --reporter=plain "app/src/**/*.kt" "buildSrc/**/*.kt" || echo "⚠️ ktlint found issues (warn-only, non-blocking)"

      - name: Bawel Minus Audit (warn-only, deteksi semua minus)
        run: python3 .github/scripts/audit_minus.py || echo "⚠️ audit_minus menemukan minus (lihat log) — warn-only, tidak fail CI"

      - name: Regenerate About Manifest From Code Evidence
        run: python3 .github/scripts/generate_about_manifest.py

      - name: Run Android Lint
        run: ./gradlew :app:lintDebug --no-daemon

      - name: Run Robolectric & JVM Unit Tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 7

      - name: Upload Lint Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: app/build/reports/lint-results*.html
          retention-days: 7

      - name: Upload Debug APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: drg-driver-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
